name: BTC N_eff backtest

# Refreshes backtest.html once per UTC day: roll the offline sample forward
# to the newest closed candle, replay it, and re-export data/backtest_web/
# (parity included, against the neff_history.csv the live run just wrote).
# It is still started by every live run, because that is the reliable clock
# (GitHub's own schedule fires hours late); the gate below skips the work
# unless the committed summary is from an earlier UTC day.
on:
  workflow_run:
    workflows: ['BTC N_eff']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Separate from the live group so a slow export never delays a live run.
# A pending run is replaced by a newer one; the newest export wins anyway.
concurrency:
  group: neff-backtest
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      INST_ID: BTC-USDT
      BT_BARS: 5m,1H,4H
      # Must match the live workflow, or parity compares two different metrics.
      WINDOW: '60'
      SMOOTH: '5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      # The offline sample is a year of bars; half an hour more changes the
      # tables in the fourth decimal. A manual run always goes through.
      - name: Daily gate
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          today = datetime.now(timezone.utc).date().isoformat()
          try:
              with open("data/backtest_web/summary.json", encoding="utf-8") as f:
                  last = json.load(f).get("generated_at") or ""
          except (OSError, ValueError):
              last = ""
          run = os.environ["EVENT"] == "workflow_dispatch" or last[:10] != today
          print(f"last export {last or 'none'}, today {today}, run={run}", file=sys.stderr)
          print(f"run={'true' if run else 'false'}")
          PY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'

      # data/ohlc/ is gitignored, so it lives in the Actions cache. The first
      # run downloads the full span (a few minutes); later runs fetch only
      # the tail. One cache entry per UTC day keeps the cache from filling
      # up; a day-old copy still needs only a page or two per bar.
      - name: Cache key
        if: steps.gate.outputs.run == 'true'
        id: key
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          path: data/ohlc
          key: ohlc-${{ env.INST_ID }}-${{ steps.key.outputs.day }}
          restore-keys: ohlc-${{ env.INST_ID }}-

      - name: Backfill OHLC
        if: steps.gate.outputs.run == 'true'
        run: python backfill_ohlc.py --inst "$INST_ID" --bars "$BT_BARS" --incremental

      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        with:
          path: data/ohlc
          key: ohlc-${{ env.INST_ID }}-${{ steps.key.outputs.day }}

      - name: Replay
        if: steps.gate.outputs.run == 'true'
        run: python backtest_neff.py replay --inst "$INST_ID" --bars "$BT_BARS"

      # Parity FAIL does not fail the job: the export records the verdict and
      # the page shows it. Only a missing panel or bad input stops here.
      - name: Export and commit
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name  "neff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="${GITHUB_REF_NAME}"

          for attempt in 1 2 3; do
            python export_backtest_web.py --inst "$INST_ID" --bars "$BT_BARS"
            git add data/backtest_web/
            if git diff --cached --quiet; then
              echo "No change, nothing to commit."
              exit 0
            fi
            git commit -q -m "Backtest summary $(date -u +%FT%H:%MZ)"

            if git push origin "HEAD:$BR"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            # The live workflow pushed in between. Same rule as there: take
            # the remote as truth and re-export, so parity sees the new
            # history. reset --hard leaves the gitignored OHLC and panels.
            echo "push rejected (attempt $attempt); resyncing to origin/$BR and re-exporting"
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
          done

          echo "still could not push after 3 attempts"
          exit 1
