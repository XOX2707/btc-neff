name: BTC N_eff

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      bars:
        description: 'Timeframes (comma separated)'
        required: false
        default: '5m,15m,1H,4H,1D'

permissions:
  contents: write

concurrency:
  group: neff
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      INST_ID: BTC-USDT
      BARS: ${{ github.event.inputs.bars || '5m,15m,1H,4H,1D' }}
      WINDOW: '60'
      SMOOTH: '5'
    steps:
      # ref: is load-bearing. Without it checkout pins to the SHA that
      # triggered the run, which for a queued run is already stale — two
      # runs then each create data/ from nothing and collide add/add.
      # Pinned to full commit SHAs: this repo requires it, and it is what
      # stops a moved tag from silently changing what runs here.
      # Bumping these is a manual step — the comment tracks the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compute N_eff
        run: python neff.py

      - name: Commit results
        run: |
          set -euo pipefail
          git config user.name  "neff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="${GITHUB_REF_NAME}"

          for attempt in 1 2 3; do
            git add data/
            if git diff --cached --quiet; then
              echo "No change, nothing to commit."
              exit 0
            fi

            N=$(python -c "import json;d=json.load(open('data/neff_latest.json'))['timeframes'];print(' '.join(f\"{k}={v['n_eff']}\" for k,v in d.items()))")
            git commit -q -m "N_eff $N"

            if git push origin "HEAD:$BR"; then
              echo "pushed on attempt $attempt"
              exit 0
            fi

            # Push rejected: the remote moved under us. Never rebase these
            # files — they are generated, and an add/add conflict cannot be
            # resolved automatically. Instead drop our commit, take the
            # remote as truth, and regenerate so the CSV appends cleanly.
            echo "push rejected (attempt $attempt); resyncing to origin/$BR and regenerating"
            git fetch origin "$BR"
            git reset --hard "origin/$BR"
            python neff.py
          done

          echo "still could not push after 3 attempts"
          exit 1
